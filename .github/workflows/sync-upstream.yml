name: Sync official Nuvio upstream

on:
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-nuvio-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge official main branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/NuvioMedia/NuvioTVSmart.git
          git fetch upstream main --tags

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork already contains the latest official Smart TV changes."
            exit 0
          fi

          git merge --no-edit upstream/main
          git push origin HEAD:main
